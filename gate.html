<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アクセス認証 - ムルチバック・ジャパン WF</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: #f0f4ff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.box {
  background: #fff;
  border-radius: 8px;
  padding: 48px 40px;
  width: 360px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  text-align: center;
}
.logo {
  font-size: 20px;
  font-weight: 900;
  color: #003087;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.sub {
  font-size: 11px;
  color: #888;
  margin-bottom: 32px;
}
h1 {
  font-size: 14px;
  color: #333;
  margin-bottom: 24px;
  font-weight: normal;
}
input[type="password"] {
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 12px 14px;
  font-size: 16px;
  margin-bottom: 16px;
  outline: none;
  transition: border-color .2s;
}
input[type="password"]:focus { border-color: #003087; }
button {
  width: 100%;
  background: #003087;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 12px;
  font-size: 15px;
  cursor: pointer;
}
button:hover { background: #00246b; }
.err {
  color: #c62828;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}
.note {
  font-size: 11px;
  color: #aaa;
  margin-top: 24px;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">■ MULTIVAC</div>
  <div class="sub">ムルチバック・ジャパン株式会社</div>
  <h1>ワイヤーフレーム閲覧にはパスワードが必要です</h1>
  <form onsubmit="check(event)">
    <input type="password" id="pw" placeholder="パスワードを入力" autofocus>
    <button type="submit">アクセスする</button>
    <p class="err" id="err">パスワードが正しくありません</p>
  </form>
  <p class="note">※ 本サイトはWEBサイトリニューアル用ワイヤーフレームです。<br>関係者限定でご共有しています。</p>
</div>
<script>
(function(){
  if(sessionStorage.getItem('wf_auth')==='ok'){
    var r=new URLSearchParams(location.search).get('r')||'index.html';
    location.replace(r);
  }
})();
function check(e){
  e.preventDefault();
  var v=document.getElementById('pw').value;
  if(v==='itlinemulti'){
    sessionStorage.setItem('wf_auth','ok');
    var r=new URLSearchParams(location.search).get('r')||'index.html';
    location.replace(r);
  }else{
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
</script>
</body>
</html>
